site_name: Mega Bench
site_description: One workshop. Your crafting library.
site_url: https://jkswoods.github.io/mega-bench/
repo_url: https://github.com/jkswoods/mega-bench
repo_name: Source on GitHub
edit_uri: ""
docs_dir: docs
site_dir: build/player-site
theme:
  name: readthedocs
  logo: assets/brand/logo.svg
  highlightjs: false
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
extra_css:
  - assets/brand/mega.css
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Installation: installation.md
  - Your first workshop: getting-started.md
  - The crafting library: library.md
  - Unlocks and upgrades: progression.md
  - Recipes: recipes.md
  - Other workbench support: bench-support.md
  - Compatibility and multiplayer: compatibility.md
  - Troubleshooting: troubleshooting.md
  - Gallery: gallery.md
  - Development status: changelog.md
  - Credits and notices: notices.md
